name: push
description: combine multi-arch image and push
inputs:
  version:
    description: version
    required: true
  latest:
    description: if tag latest
    required: false
  dev:
    description: if set then it's a dev version
runs:
  using: "composite"
  steps:
    - name: Build image
      env:
        JAVA_VER: ${{ inputs.version }}
        JAVA_DEV: ${{ inputs.dev }}
        LATEST: ${{ inputs.latest }}
      run: |
        . $GITHUB_ACTION_PATH/release.sh
      shell: bash
